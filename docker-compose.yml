name: canteen-preorder

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: canteen
      POSTGRES_PASSWORD: canteen
      POSTGRES_DB: canteen
      TZ: Asia/Almaty
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canteen -d canteen"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "true"
    # Applies migrations (and loads demo data into an empty database) before starting the API.
    command: sh -c "python -m scripts.bootstrap && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://canteen:canteen@db:5432/canteen
      REDIS_URL: redis://redis:6379/0
      AUTO_SEED: "true"
      SMTP_HOST: mailpit
      # The source is bind-mounted; keep tool caches out of it so the non-root user can write them.
      RUFF_CACHE_DIR: /tmp/.ruff_cache
      COVERAGE_FILE: /tmp/.coverage
      PYTEST_ADDOPTS: -p no:cacheprovider
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Scheduled jobs (SPEC 10): slots at 05:00, expiring unpaid orders every minute, ...
  worker:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "true"
    command: sh -c "python -m scripts.wait_for_migrations && python -m worker.main"
    # The image's healthcheck probes the API port; the worker serves no HTTP.
    healthcheck:
      disable: true
    environment:
      DATABASE_URL: postgresql+psycopg://canteen:canteen@db:5432/canteen
      REDIS_URL: redis://redis:6379/0
      SMTP_HOST: mailpit
    env_file:
      - path: .env
        required: false
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      target: dev
    command: sh ./docker-dev.sh
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  db_data:
  frontend_node_modules:
