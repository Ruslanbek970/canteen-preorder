global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # HTTP metrics of the API (all gunicorn processes, multiprocess mode).
  - job_name: backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
  # Business metrics (orders, slots, database) and background jobs.
  - job_name: worker
    static_configs:
      - targets: ["worker:9100"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
