# The application behind nginx; included by http.conf.template and https.conf.template.
include /etc/nginx/snippets/security.conf;

client_max_body_size 2m;
gzip on;
gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

root /usr/share/nginx/html;

# No per-IP rate limit here: a whole campus shares a few IPs. The API limits per user.
location /api/ {
  proxy_pass http://backend:8000;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Request-ID $request_id;
  proxy_read_timeout 60s;
}

location /ws/ {
  proxy_pass http://backend:8000;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_read_timeout 1h;
}

location /grafana/ {
  proxy_pass http://grafana:3000;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
}

# The service worker must never be cached, or a new release would not reach phones.
location = /sw.js {
  add_header Cache-Control "no-cache";
  include /etc/nginx/snippets/security.conf;
}

location = /manifest.webmanifest {
  default_type application/manifest+json;
  add_header Cache-Control "no-cache";
  include /etc/nginx/snippets/security.conf;
}

location /assets/ {
  expires 1y;
  add_header Cache-Control "public, immutable";
  include /etc/nginx/snippets/security.conf;
}

location / {
  try_files $uri $uri/ /index.html;
  add_header Cache-Control "no-cache";
  include /etc/nginx/snippets/security.conf;
}
