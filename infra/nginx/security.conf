# Included in every location that sets its own headers (add_header is not inherited then).
# HSTS is ignored by browsers over plain HTTP, so it is safe in both modes.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), geolocation=(), microphone=()" always;
