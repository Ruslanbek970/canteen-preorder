[project]
name = "canteen-preorder-backend"
version = "0.1.0"
description = "Canteen Pre-order backend (FastAPI)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy>=2.0.36,<2.1",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.14,<2",
    "redis>=5.2,<6",
    "bcrypt>=4.2,<5",
    "pyjwt>=2.10,<3",
    "email-validator>=2.2,<3",
    "python-multipart>=0.0.20",
    "apscheduler>=3.10,<4",
    "aiogram>=3.13,<4",
    "pywebpush>=2.0,<3",
    "scikit-learn>=1.5,<2",
    "pandas>=2.2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.8",
    "pre-commit>=4.0",
    "matplotlib>=3.9,<4",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "worker*", "bot*", "ml*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "DTZ"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff.lint.isort]
known-first-party = ["app", "worker", "bot", "ml", "scripts", "tests"]
known-third-party = ["alembic"]
